# Runs the quality gates that cannot be run by hand from a browser or an API
# client: production configuration, type checking, linting, build, and tests.

name: Verify

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Production configuration, type check, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Non-production CI-only values. They are deliberately valid shapes so
      # validate:env exercises the production configuration contract without
      # exposing or connecting to a real service.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-jwt-secret-9c8e7d6b5a4f3e2d1c0b9876543210
      CRON_SECRET: ci-cron-secret-9c8e7d6b5a4f3e2d1c0b987654321
      CONFIG_ENCRYPTION_KEY: ci-config-encryption-9c8e7d6b5a4f3e2d1c0
      NEXT_PUBLIC_SITE_URL: https://ci.code-up.tech
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ci-recaptcha-site-token-9c8e7d6b5a4f
      RECAPTCHA_API_KEY: ci-recaptcha-api-token-9c8e7d6b5a4f
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        id: install
        run: |
          set +e
          npm ci --no-audit --no-fund > install.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "" >> install.txt
            echo "--- npm ci failed (exit $code); retrying with a clean npm install ---" >> install.txt
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund >> install.txt 2>&1
            code=$?
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate the Prisma client
        id: prisma
        if: steps.install.outputs.code == '0'
        run: |
          set +e
          node scripts/prisma-generate.js > prisma.txt 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate production configuration
        id: envcheck
        if: steps.install.outputs.code == '0'
        run: |
          set +e
          NODE_ENV=production npm run validate:env > envcheck.txt 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Type check
        id: typecheck
        if: steps.install.outputs.code == '0'
        run: |
          set +e
          npx tsc --noEmit > typecheck.txt 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Lint
        id: lint
        if: steps.install.outputs.code == '0'
        run: |
          set +e
          npm run lint > lint.txt 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build
        id: build
        if: steps.install.outputs.code == '0'
        run: |
          set +e
          npm run build > build.txt 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Unit tests
        id: tests
        if: steps.install.outputs.code == '0'
        run: |
          set +e
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.test?0:1)"; then
            npm test > tests.txt 2>&1
            code=$?
          else
            echo "No test script in package.json; skipped." > tests.txt
            code=0
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assemble the report
        id: report
        if: always()
        env:
          INSTALL: ${{ steps.install.outputs.code }}
          PRISMA: ${{ steps.prisma.outputs.code }}
          ENVCHECK: ${{ steps.envcheck.outputs.code }}
          TYPECHECK: ${{ steps.typecheck.outputs.code }}
          LINT: ${{ steps.lint.outputs.code }}
          BUILD: ${{ steps.build.outputs.code }}
          TESTS: ${{ steps.tests.outputs.code }}
        run: |
          verdict() {
            if [ -z "$1" ]; then echo "skipped";
            elif [ "$1" = "0" ]; then echo "pass";
            else echo "**FAIL** (exit $1)"; fi
          }
          {
            echo "## Verify"
            echo
            echo "Commit \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Install dependencies | $(verdict "$INSTALL") |"
            echo "| \`prisma generate\` | $(verdict "$PRISMA") |"
            echo "| Production configuration | $(verdict "$ENVCHECK") |"
            echo "| \`tsc --noEmit\` | $(verdict "$TYPECHECK") |"
            echo "| \`npm run lint\` | $(verdict "$LINT") |"
            echo "| \`npm run build\` | $(verdict "$BUILD") |"
            echo "| \`npm test\` | $(verdict "$TESTS") |"
            echo
            for gate in envcheck typecheck build tests prisma lint install; do
              if [ -f "$gate.txt" ]; then
                lines=$(wc -l < "$gate.txt")
                echo "<details><summary><code>$gate</code> &mdash; last 200 of $lines lines</summary>"
                echo
                echo '```'
                tail -n 200 "$gate.txt"
                echo '```'
                echo
                echo "</details>"
                echo
              fi
            done
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the report on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file report.md

      - name: Fail if any gate failed
        if: always()
        env:
          INSTALL: ${{ steps.install.outputs.code }}
          PRISMA: ${{ steps.prisma.outputs.code }}
          ENVCHECK: ${{ steps.envcheck.outputs.code }}
          TYPECHECK: ${{ steps.typecheck.outputs.code }}
          LINT: ${{ steps.lint.outputs.code }}
          BUILD: ${{ steps.build.outputs.code }}
          TESTS: ${{ steps.tests.outputs.code }}
        run: |
          failed=0
          for name in INSTALL PRISMA ENVCHECK TYPECHECK LINT BUILD TESTS; do
            value="${!name}"
            if [ -n "$value" ] && [ "$value" != "0" ]; then
              echo "$name failed with exit code $value"
              failed=1
            fi
          done
          exit "$failed"
